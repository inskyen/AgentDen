# AgentDen v0 log forwarding -- TEMPLATE (rsyslog)
#
# !!! Deploy ONLY with the owner's explicit authorization. !!!
# Purpose: the audit trail is only worth something if it ALSO lives
# somewhere the (root) owner of the den machine does NOT control.
# A local root can stop auditd and rewrite /var/log/audit/audit.log --
# that is exactly the "camera removed" case den reconcile alerts on.
#
# Replace RECEIVER_HOST with the external append-only receiver
# (agent's own cloud box, WORM bucket, or a third-party log service).
# Prefer TLS (see rsyslog omfwd + gtls docs) for anything beyond a demo.

module(load="imfile" PollingInterval="10")

input(type="imfile"
      File="/var/log/audit/audit.log"
      Tag="auditd-agentden:"
      PersistStateInterval="100")

# forward everything tagged, keep a local copy too
if $syslogtag == 'auditd-agentden:' then @@RECEIVER_HOST:514
& ~
